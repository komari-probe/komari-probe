name: Build frontend theme
description: Clone sonar-web, build the default theme, and optionally upload it as an artifact.

inputs:
  node-version:
    description: Node.js version used to build sonar-web.
    default: "23"
  repository:
    description: sonar-web repository URL.
    default: https://github.com/sonar-probe/sonar-web
  ref:
    description: Optional sonar-web ref to build. Uses the repository default branch when empty.
    default: ""
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install zstd
      shell: bash
      run: |
        set -euxo pipefail
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y zstd
        fi

    - name: Clone and build frontend
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf sonar-web
        if [ -n "${{ inputs.ref }}" ]; then
          git clone --depth=1 --branch "${{ inputs.ref }}" "${{ inputs.repository }}" sonar-web
        else
          git clone --depth=1 "${{ inputs.repository }}" sonar-web
        fi
        cd sonar-web
        npm install
        npm run build
        cd ..

        mkdir -p internal/platform/frontend/defaultTheme
        rm -rf internal/platform/frontend/defaultTheme/dist internal/platform/frontend/defaultTheme/dist.tar.zst
        test -f sonar-web/dist/index.html
        test -f sonar-web/dist/admin/admin.html
        tar -cf "$RUNNER_TEMP/sonar-default-dist.tar" -C sonar-web/dist .
        zstd -19 -T0 -q -f "$RUNNER_TEMP/sonar-default-dist.tar" -o internal/platform/frontend/defaultTheme/dist.tar.zst
        rm -f "$RUNNER_TEMP/sonar-default-dist.tar"
        if [ -f sonar-web/sonar-theme.json ]; then cp -f sonar-web/sonar-theme.json internal/platform/frontend/defaultTheme/; fi
        if [ -f sonar-web/komari-theme.json ]; then cp -f sonar-web/komari-theme.json internal/platform/frontend/defaultTheme/; fi
        if [ -f sonar-web/preview.png ]; then cp -f sonar-web/preview.png internal/platform/frontend/defaultTheme/; fi
        if [ -f sonar-web/perview.png ]; then cp -f sonar-web/perview.png internal/platform/frontend/defaultTheme/; fi
        if [ -f internal/platform/frontend/defaultTheme/preview.png ] && [ ! -f internal/platform/frontend/defaultTheme/perview.png ]; then cp -f internal/platform/frontend/defaultTheme/preview.png internal/platform/frontend/defaultTheme/perview.png; fi
        if [ -f internal/platform/frontend/defaultTheme/perview.png ] && [ ! -f internal/platform/frontend/defaultTheme/preview.png ]; then cp -f internal/platform/frontend/defaultTheme/perview.png internal/platform/frontend/defaultTheme/preview.png; fi

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C internal/platform/frontend/defaultTheme .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
