name: Development Environment

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-binaries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone and build frontend
        uses: ./.github/actions/build-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build application
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION_SHA="${{ github.sha }}"
          go build -ldflags "-X github.com/sonar-probe/sonar/internal/version.CurrentVersion=dev -X github.com/sonar-probe/sonar/internal/version.VersionHash=${VERSION_SHA}" -o sonar .

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonar
          path: sonar

  deploy-to-production:
    needs: build-binaries
    runs-on: ubuntu-latest
    env:
      PRODUCTION_SERVER: ${{ vars.PRODUCTION_SERVER }}
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: sonar

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.PRODUCTION_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production
        run: |
          chmod +x sonar
          ssh root@${{ env.PRODUCTION_SERVER }} 'mkdir -p /opt/sonar/ && systemctl stop sonar.service 2>/dev/null || systemctl stop komari.service 2>/dev/null || true'
          ssh root@${{ env.PRODUCTION_SERVER }} 'mv /opt/sonar/sonar /opt/sonar/sonar.old 2>/dev/null || true'
          scp sonar root@${{ env.PRODUCTION_SERVER }}:/opt/sonar/sonar
          ssh root@${{ env.PRODUCTION_SERVER }} 'if [ -d /opt/komari ]; then cp -f /opt/sonar/sonar /opt/komari/komari 2>/dev/null || true; fi'
          ssh root@${{ env.PRODUCTION_SERVER }} 'systemctl start sonar.service 2>/dev/null || systemctl start komari.service 2>/dev/null || true'
